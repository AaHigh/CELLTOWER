<script>
// Error reporter — HTML div visible before canvas works
window.onerror = function(msg, src, line, col, err) {
  var d = document.getElementById('errdiv');
  if(d){ d.style.display='block'; d.textContent = 'ERR L'+line+': '+msg+'\n'+(err&&err.stack?err.stack:''); }
  return false;
};
window.addEventListener('unhandledrejection', function(e){
  var d = document.getElementById('errdiv');
  if(d){ d.style.display='block'; d.textContent += '\nPromise: '+e.reason; }
});

function showErr(msg){
  var d = document.getElementById('errdiv');
  if(d){ d.style.display='block'; d.textContent += '\n'+msg; }
}

// ═══════════════════════════════════════════════════════════════════════
// CELLTOWER — single-canvas renderer
// All layout, UI, input handled here. Game logic below is unchanged.
// ═══════════════════════════════════════════════════════════════════════

const cv = document.getElementById('cv');
const CTX = cv.getContext('2d');

// ── Screen dimensions ─────────────────────────────────────────────────
const VERSION = '0.422';
let SW, SH;   // screen width/height
var CELL = 20; // tetris cell size — also declared by game logic (var hoists safely)

// ── Safe defaults for game globals (real values set by game logic) ────
var score=0, level=1, lines=0, hi=0, dead=false, paused=false;
var _gamePauseCount=0, _gamePauseStartT=0, _gameTotalPauseMs=0;
var board=null, cur=null, cx=0, cy=0, nxt=null;
var placements=null, particles=[], explodedCells=new Set();
var selectedPlacementIdx=null; // which slot is highlighted (null = none)
var _navStartT=0; // AT timestamp when piece navigation animation started
var _p10Log=[]; // per-piece log for first-10 debug audit
var piecePot=0, tetrisPot=0;
var AUTO_PLAY=false, AUTO_SPEED=10.66, autoUsed=false;
var _replayMode=false, _replayPlacements=[], _replayIdx=0, _replayTimer=null;
var _replayPaused=false;      // replay-only pause — never touches game `paused` state
var _replayMeta={score:0,lines:0,level:0,pieces:0};
var _pendingReplayStream=null, _replayPromptVisible=false;
var _replaySource=null;       // stream that finished — enables restart
var _replayDisplayName=null;  // name shown in badge during replay — never touches _currentPlayer
var _replayInterruptedIdentity=false; // true if CTRL-V fired while name-entry screen was open
// Screen shake — 4 independent sinusoidal channels, normalized so total energy=1
// Each channel: {phx, phy, fx, fy, mx, my} — random phase & freq per axis per layer
var _shakeT=0, _shakeDur=0, _shakeAmp=0;
var _shakeField={phx:0,phy:0,fx:0,fy:0,mx:0,my:0};
var _shakeHUD  ={phx:0,phy:0,fx:0,fy:0,mx:0,my:0};
var AT=0;
var playerHasMoved=false, moveStartTime=0;
var _tipMoveCount=0, _tipChoiceUsed=false, _tipShownAt=0, _tipDismissed=false;

// ── Layout regions (computed in layout()) ────────────────────────────
let R = {};   // named rects: {x,y,w,h}

// ── Game state mirrors (set by game logic, read by renderer) ─────────
let ui = {
  score:0, level:1, lines:0, hi:0,
  tickers:[],          // [{text,hue}]
  prevPlacements:[null,null,null,null],
  tetrisReady:false,   // I-piece loaded
  paused:false,
  dead:false,
  gameStarted:false,   // false = show start screen
  autoOn:false,
  autoUsed:false,
  autoSpeed:7.11,
  startPulse:0,
  flash:null,          // {text, until}
  towerSev:0,
  debugMode:false,     // triple-tap LEVEL box to toggle
  _levelTaps:[],       // timestamps for triple-tap detection
};

// ── Fonts ─────────────────────────────────────────────────────────────
const FONT_TITLE = 'bold 900 {S}px monospace';
const FONT_LABEL = '700 {S}px monospace';
const FONT_VAL   = '900 {S}px monospace';
const FONT_SMALL = '600 {S}px monospace';
function F(template, size){ return template.replace('{S}', Math.round(size)); }

// ── Colors ────────────────────────────────────────────────────────────
const C = {
  bg:      '#080018',
  panel:   'rgba(20,0,40,0.85)',
  border:  '#5500aa',
  borderHi:'#00ffaa',
  cyan:    '#00ffff',
  yellow:  '#ffff00',
  orange:  '#ff8800',
  red:     '#ff4444',
  purple:  '#aa88ff',
  white:   '#ffffff',
  dimText: '#664488',
  green:   '#00ff88',
  autoBorder: '#00ffaa',
};

// ── Touch/hit regions ─────────────────────────────────────────────────
let hitZones = [];  // [{id, x,y,w,h}]

function addHit(id, x, y, w, h){
  hitZones.push({id, x:Math.round(x), y:Math.round(y), w:Math.round(w), h:Math.round(h)});
}

// ── Resize ────────────────────────────────────────────────────────────
function resize(){
  // Use documentElement.clientWidth/Height — these exclude scrollbars
  // and give true viewport size on iOS Safari
  SW = document.documentElement.clientWidth  || window.innerWidth  || 390;
  SH = document.documentElement.clientHeight || window.innerHeight || 844;
  cv.width  = SW;
  cv.height = SH;
  cv.style.width  = SW + 'px';
  cv.style.height = SH + 'px';
  computeLayout();
}

function computeLayout(){
  hitZones = [];

  // Fixed proportions that work on any phone:
  // Left info col | Playfield | Right info col
  // Piece buttons row
  // Control buttons row
  // Auto row

  const PAD = Math.round(SW * 0.02);
  const GAP = Math.round(SW * 0.015);

  // Control row at bottom: 6 round buttons
  const CTRL_H = Math.round(SH * 0.085);
  const CTRL_Y = SH - CTRL_H - PAD;

  // Auto row above controls
  const AUTO_H = Math.round(SH * 0.055);
  const AUTO_Y = CTRL_Y - AUTO_H - GAP;

  // Piece selector row above auto
  const PIECE_H = Math.round(SH * 0.10);
  const PIECE_Y = AUTO_Y - PIECE_H - GAP;

  // Title bar
  const TITLE_H = Math.round(SH * 0.045);
  const TITLE_Y = PAD;

  // Main area between title and piece row
  const MAIN_Y = TITLE_Y + TITLE_H + GAP;
  const MAIN_H = PIECE_Y - MAIN_Y - GAP;

  // Side panels: fixed width
  const SIDE_W = Math.round(SW * 0.175);

  // Playfield in center
  const PF_W = SW - 2*SIDE_W - 2*GAP - 2*PAD;
  const PF_X = PAD + SIDE_W + GAP;

  // CELL size
  CELL = Math.floor(Math.min(PF_W / 10, MAIN_H / 25));
  if(CELL < 8) CELL = 8;
  const GW = CELL * 10;
  const GH = CELL * 25;

  // Center the playfield vertically in MAIN area
  const GX = Math.round(PF_X + (PF_W - GW)/2);
  const GY = MAIN_Y + Math.round((MAIN_H - GH)/2);

  R = {
    title:  {x:PAD, y:TITLE_Y, w:SW-2*PAD, h:TITLE_H},
    // Left panel boxes
    lScore: {x:PAD, y:MAIN_Y,                          w:SIDE_W, h:Math.round(MAIN_H*0.18)},
    lLevel: {x:PAD, y:MAIN_Y+Math.round(MAIN_H*0.20), w:SIDE_W, h:Math.round(MAIN_H*0.18)},
    lLines: {x:PAD, y:MAIN_Y+Math.round(MAIN_H*0.40), w:SIDE_W, h:Math.round(MAIN_H*0.18)},
    lTicker:{x:PAD, y:MAIN_Y+Math.round(MAIN_H*0.60), w:SIDE_W, h:Math.round(MAIN_H*0.40)},
    // Right panel boxes
    rNext:  {x:SW-PAD-SIDE_W, y:MAIN_Y,                          w:SIDE_W, h:Math.round(MAIN_H*0.22)},
    rHi:    {x:SW-PAD-SIDE_W, y:MAIN_Y+Math.round(MAIN_H*0.24), w:SIDE_W, h:Math.round(MAIN_H*0.14)},
    rPause: {x:SW-PAD-SIDE_W, y:MAIN_Y+Math.round(MAIN_H*0.40), w:SIDE_W, h:Math.round(MAIN_H*0.14)},
    rTBonus:{x:SW-PAD-SIDE_W, y:MAIN_Y+Math.round(MAIN_H*0.56), w:SIDE_W, h:Math.round(MAIN_H*0.22)},
    rHoles: {x:SW-PAD-SIDE_W, y:MAIN_Y+Math.round(MAIN_H*0.80), w:SIDE_W, h:Math.round(MAIN_H*0.18)},
    // Playfield
    gx: GX, gy: GY, gw: GW, gh: GH,
    // Piece row
    pieces: {x:PAD, y:PIECE_Y, w:SW-2*PAD, h:PIECE_H},
    // Controls row
    ctrl:   {x:PAD, y:CTRL_Y,  w:SW-2*PAD, h:CTRL_H},
    // Auto row
    auto:   {x:PAD, y:AUTO_Y,  w:SW-2*PAD, h:AUTO_H},
    PAD, GAP, SIDE_W,
    PIECE_Y, PIECE_H, CTRL_Y, CTRL_H, AUTO_Y, AUTO_H,
    MAIN_Y, MAIN_H,
  };

  // Register hit zones
  addHit('pause',  R.rPause.x, R.rPause.y, R.rPause.w, R.rPause.h);

  const PW = Math.round((R.pieces.w - 3*GAP) / 4);
  for(let i=0;i<4;i++){
    addHit('piece'+i, R.pieces.x + i*(PW+GAP), R.pieces.y, PW, R.pieces.h);
  }

  const CBW = Math.round((R.ctrl.w - 5*GAP) / 6);
  const cbIds = ['rotl','left','soft','hard','right','rotr'];
  for(let i=0;i<6;i++){
    addHit('ctrl_'+cbIds[i], R.ctrl.x + i*(CBW+GAP), R.ctrl.y, CBW, R.ctrl.h);
  }

  // Auto row: [AUTO toggle] [====slider====] [speed val] [RECEIPT]
  const AUTO_BTN_W = Math.round(R.auto.w * 0.25);
  const RECEIPT_W  = Math.round(R.auto.w * 0.25);
  addHit('auto_toggle', R.auto.x, R.auto.y, AUTO_BTN_W, R.auto.h);
  addHit('receipt',     R.auto.x + R.auto.w - RECEIPT_W, R.auto.y, RECEIPT_W, R.auto.h);
  addHit('marquee',     0, R.title.y, SW, R.title.h);
  // Slider zone
  const SLX = R.auto.x + AUTO_BTN_W + GAP;
  const SLW = R.auto.w - AUTO_BTN_W - RECEIPT_W - 2*GAP;
  addHit('speed_slider', SLX, R.auto.y, SLW, R.auto.h);
  R.sliderX = SLX; R.sliderW = SLW;
}


// ══════════════════════════════════════════════════════════════════════
// DRAW HELPERS
// ══════════════════════════════════════════════════════════════════════

function roundRect(x,y,w,h,r){
  CTX.beginPath();
  CTX.moveTo(x+r,y);
  CTX.lineTo(x+w-r,y); CTX.quadraticCurveTo(x+w,y,x+w,y+r);
  CTX.lineTo(x+w,y+h-r); CTX.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  CTX.lineTo(x+r,y+h); CTX.quadraticCurveTo(x,y+h,x,y+h-r);
  CTX.lineTo(x,y+r); CTX.quadraticCurveTo(x,y,x+r,y);
  CTX.closePath();
}

function panel(x,y,w,h, borderColor){
  roundRect(x,y,w,h, 6);
  CTX.fillStyle = C.panel;
  CTX.fill();
  CTX.strokeStyle = borderColor || C.border;
  CTX.lineWidth = 1.5;
  CTX.stroke();
}

function label(text, x, y, w, color, size){
  // Route all labels through the DM dot-matrix bitmap font
  const h = (size || 10) * 1.4;
  _dmWordLabel(CTX, text, x, y, w, h, color || C.purple);
}

function val(text, x, y, w, color, size){
  // Non-numeric values (like pause icon) still use canvas text
  CTX.font = F(FONT_VAL, size||14);
  CTX.fillStyle = color || C.cyan;
  CTX.textAlign = 'center';
  CTX.textBaseline = 'middle';
  CTX.shadowColor = color || C.cyan;
  CTX.shadowBlur = 6;
  CTX.fillText(text, x + w/2, y);
  CTX.shadowBlur = 0;
}

// ── DM word label — render a word using the dot-matrix bitmap font, scaled ──
function _dmWordLabel(ctx, word, x, y, w, h, color){
  const str = word.toUpperCase();
  const n   = str.length;
  if(!n) return;
  // Each glyph is 5 cols × 7 rows of dots
  // Scale dot size so word fills width & height
  const dotW = Math.min(w / (n * 6), h / 8); // 6 = 5cols+1gap, 8=7rows+1gap
  const dotH = dotW;
  const charW = 6 * dotW;
  const charH = 7 * dotH;
  const totalW = n * charW;
  const startX = x + (w - totalW) / 2;
  const startY = y + (h - charH) / 2;
  ctx.fillStyle = color || '#ffffff';
  ctx.shadowColor = color || '#ffffff';
  ctx.shadowBlur  = dotW * 1.5;
  for(let ci = 0; ci < n; ci++){
    const ch = str[ci];
    const glyph = DM_FONT[ch] || DM_FONT[' '];
    const ox = startX + ci * charW;
    for(let col = 0; col < 5; col++){
      const colBits = glyph[col] || 0;
      for(let row = 0; row < 7; row++){
        if(colBits & (1 << row)){
          ctx.fillRect(
            ox  + col * dotW,
            startY + row * dotH,
            Math.max(1, dotW - 0.5),
            Math.max(1, dotH - 0.5)
          );
        }
      }
    }
  }
  ctx.shadowBlur = 0;
}


// Standard 7-seg: a=top b=top-right c=bot-right d=bot e=bot-left f=top-left g=mid
// Bit encoding: a=1 b=2 c=4 d=8 e=16 f=32 g=64
const SEG7 = {'0':0x3F,'1':0x06,'2':0x5B,'3':0x4F,'4':0x66,
               '5':0x6D,'6':0x7D,'7':0x07,'8':0x7F,'9':0x6F,' ':0x00,'-':0x40};

function _draw7SegDigits(ctx, digits, areaX, areaW, areaY, areaH, padTo, litColor, glowColor, dimColor){
  const str   = String(digits);
  const padded = str.length < padTo ? str.padStart(padTo, ' ') : str;
  const chars  = padded.split('');
  const n      = chars.length;
  const segW   = Math.min(areaW / (n * 1.22), areaH * 0.52);
  const segH   = segW * 1.9;
  const gap    = segW * 0.22;
  const totalW = n * segW + (n-1) * gap;
  const startX = areaX + (areaW - totalW) / 2;
  const startY = areaY + (areaH - segH) / 2;
  const sw     = Math.max(1.5, segW * 0.14);
  const inset  = sw * 0.6;
  ctx.save(); ctx.lineCap = 'round';
  chars.forEach((ch, i) => {
    const bits = SEG7[ch] !== undefined ? SEG7[ch] : 0x00;
    const dx = startX + i*(segW+gap);
    const dy = startY;
    const my2 = dy + segH/2;
    const seg = (on, path) => {
      ctx.beginPath(); path();
      ctx.strokeStyle = on ? litColor : dimColor;
      ctx.lineWidth   = sw;
      ctx.shadowBlur  = on ? sw*2.5 : 0;
      ctx.shadowColor = on ? glowColor : 'transparent';
      ctx.stroke();
    };
    const s = inset;
    seg(bits&0x01,()=>{ ctx.moveTo(dx+s,         dy+sw*.5);      ctx.lineTo(dx+segW-s,    dy+sw*.5);      });
    seg(bits&0x02,()=>{ ctx.moveTo(dx+segW-sw*.5, dy+s);         ctx.lineTo(dx+segW-sw*.5,my2-s);         });
    seg(bits&0x04,()=>{ ctx.moveTo(dx+segW-sw*.5, my2+s);        ctx.lineTo(dx+segW-sw*.5,dy+segH-s);     });
    seg(bits&0x08,()=>{ ctx.moveTo(dx+s,          dy+segH-sw*.5);ctx.lineTo(dx+segW-s,    dy+segH-sw*.5); });
    seg(bits&0x10,()=>{ ctx.moveTo(dx+sw*.5,      my2+s);        ctx.lineTo(dx+sw*.5,     dy+segH-s);     });
    seg(bits&0x20,()=>{ ctx.moveTo(dx+sw*.5,      dy+s);         ctx.lineTo(dx+sw*.5,     my2-s);         });
    seg(bits&0x40,()=>{ ctx.moveTo(dx+s,          my2);          ctx.lineTo(dx+segW-s,    my2);            });
  });
  ctx.shadowBlur = 0;
  ctx.restore();
}

function draw7SegScore(r, labelText, value, colorOpts){

function drawCell(ctx, x, y, s, rgb, t){
  if(!rgb) return;
  const [r,g,b] = rgb;
  // Base fill
  ctx.fillStyle = `rgb(${r},${g},${b})`;
  ctx.fillRect(x+1, y+1, s-2, s-2);
  // Top/left highlight
  const hl = Math.min(255, r+80);
  const hg = Math.min(255, g+80);
  const hb = Math.min(255, b+80);
  ctx.fillStyle = `rgba(${hl},${hg},${hb},0.6)`;
  ctx.fillRect(x+1, y+1, s-2, 2);
  ctx.fillRect(x+1, y+1, 2, s-2);
  // Bottom/right shadow
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(x+1, y+s-3, s-2, 2);
  ctx.fillRect(x+s-3, y+1, 2, s-2);
  // Pulse outline
  if(t !== undefined){
    const pulse = 0.4 + 0.3*Math.sin(t*3 + r*0.01);
    ctx.strokeStyle = `rgba(${r},${g},${b},${pulse})`;
    ctx.lineWidth = 0.5;
    ctx.strokeRect(x+0.5, y+0.5, s-1, s-1);
  }
}

function triggerShake(amp, dur){
  _shakeAmp = amp;
  _shakeDur = dur;
  _shakeT   = performance.now();

  // Generate 4 independent random magnitudes for playfield x/y and HUD x/y.
  // Normalize so sum-of-squares = 1 (energy conserved on unit circle, not square).
  function rndChan(){ return 0.3 + Math.random() * 0.7; } // non-zero [0.3,1.0]
  const raw = [rndChan(), rndChan(), rndChan(), rndChan()];
  const norm = Math.sqrt(raw.reduce((s,v)=>s+v*v, 0));
  const [fmx, fmy, hmx, hmy] = raw.map(v=>v/norm);

  // Random frequencies 18–55 Hz and random phases 0–2π per axis
  function rndFreq(){ return 18 + Math.random() * 37; }
  function rndPh(){   return Math.random() * Math.PI * 2; }

  _shakeField = { phx:rndPh(), phy:rndPh(), fx:rndFreq(), fy:rndFreq(), mx:fmx, my:fmy };
  _shakeHUD   = { phx:rndPh(), phy:rndPh(), fx:rndFreq(), fy:rndFreq(), mx:hmx, my:hmy };
}

// Returns {dx,dy} for a shake layer at elapsed seconds with trauma-squared decay
function _shakeOffset(layer, elapsedMs, amp, decay){
  const s = elapsedMs * 0.001;
  const dx = amp * decay * layer.mx * Math.sin(s * layer.fx * Math.PI * 2 + layer.phx);
  const dy = amp * decay * layer.my * Math.cos(s * layer.fy * Math.PI * 2 + layer.phy);
  return {dx, dy};
}

function draw(ts){
  if(!SW||!SH||!R.gw) return; // layout not ready yet
  const t = ts * 0.001;

  // Identity screen takes over the full canvas
  if(_identityScreen){ drawIdentityScreen(t); return; }

  // Background
  const bg = CTX.createLinearGradient(0,0,SW,SH);
  bg.addColorStop(0,'#080018'); bg.addColorStop(1,'#050015');
  CTX.fillStyle = bg;
  CTX.fillRect(0,0,SW,SH);

  drawTitle(t);

  if(!ui.gameStarted){
    drawStartScreen(t);
  } else {
    // Shake: compute decay once, derive independent offsets for HUD vs playfield
    const _shakeElapsed = ts - _shakeT;
    const _shakeFrac = _shakeDur > 0 ? Math.max(0, 1 - _shakeElapsed / _shakeDur) : 0;
    const _decay = _shakeFrac * _shakeFrac; // trauma-squared

    if(_decay > 0){
      // HUD panels shake on their own layer
      const hud = _shakeOffset(_shakeHUD, _shakeElapsed, _shakeAmp, _decay);
      CTX.save(); CTX.translate(hud.dx, hud.dy);
      drawLeftPanel(t);
      drawRightPanel(t);
      CTX.restore();

      // Playfield shakes on independent layer
      const pf = _shakeOffset(_shakeField, _shakeElapsed, _shakeAmp, _decay);
      CTX.save(); CTX.translate(pf.dx, pf.dy);
      drawPlayfield(t);
      CTX.restore();

      // Control rows shake with HUD layer (they're part of the glass)
      CTX.save(); CTX.translate(hud.dx, hud.dy);
      drawPieceRow(t);
      drawAutoRow(t);
      drawControlRow(t);
      CTX.restore();
    } else {
      drawLeftPanel(t);
      drawRightPanel(t);
      drawPlayfield(t);
      drawPieceRow(t);
      drawAutoRow(t);
      drawControlRow(t);
    }
    if(paused) drawPauseOverlay();
    if(_killScreenActive) drawKillScreen(performance.now());
    else if(dead) drawGameOverOverlay();
  }

  if(_receiptOpen) drawReceiptOverlay(t);
  if(_replayPromptVisible) _drawReplayPrompt();
  if(ui.flash && ts < ui.flash.until) drawFlash(t);
  drawTipBubble(t);

  // DEBUG TAP — only shown when debug mode is on
  if(ui.debugMode && ui._dbgTap && (t - ui._dbgTap.t) < 2.0){
    CTX.save();
    CTX.globalAlpha = 1.0;
    CTX.fillStyle = 'rgba(0,0,0,0.7)';
    CTX.fillRect(0, SH*0.45, SW, 40);
    CTX.font = 'bold 16px monospace';
    CTX.fillStyle = '#ff0';
    CTX.textAlign = 'center';
    CTX.textBaseline = 'middle';
    CTX.fillText('TAP: '+ui._dbgTap.id+' ('+Math.round(ui._dbgTap.tx)+','+Math.round(ui._dbgTap.ty)+')', SW/2, SH*0.45+20);
    // Also draw a crosshair at tap point
    CTX.strokeStyle='#f00'; CTX.lineWidth=2;
    CTX.beginPath(); CTX.moveTo(ui._dbgTap.tx-10,ui._dbgTap.ty); CTX.lineTo(ui._dbgTap.tx+10,ui._dbgTap.ty); CTX.stroke();
    CTX.beginPath(); CTX.moveTo(ui._dbgTap.tx,ui._dbgTap.ty-10); CTX.lineTo(ui._dbgTap.tx,ui._dbgTap.ty+10); CTX.stroke();
    CTX.restore();
  }
  // drawDebug();
}

// ── Title ────────────────────────────────────────────────────────────
// ── Scrolling LED marquee — full viewport width ───────────────────────
const MARQUEE_MESSAGES = [
  'TAP THIS SCROLLING MESSAGE TO PAUSE IT!',
  ' CELLTOWER  v'+VERSION,
  'THE  CELLTOWER  DISTRICT',
  'TAP A PIECE OR GHOST ON BOARD TO PLACE INSTANTLY',
  ' FRESNO  559-485-9050  ',
  'NO HOLES = BIGGER BONUS  ',
  'TETRIS STREAKS MULTIPLY YOUR POT  ',
  'MADE WITH ANTHROPIC CLAUDE AI  ',
];
const MARQUEE_PX_PER_SEC = 320;
const MARQUEE_HUE_SPEED  = 0.5;
const MARQUEE_SHEAR      = 0.22;

// Simple continuous scroll — no auto-stops
let _mqOffset     = 0;      // pixels scrolled from start of current message
let _mqUserPaused = false;  // toggled by tapping marquee
let _mqPauseCount = 0;      // how many times player has paused via marquee tap
let _mqPauseStartT = 0;     // performance.now() when current pause began
let _mqTotalPauseMs = 0;    // cumulative pause milliseconds this session
let _mqHueOffset  = 0;
let _mqLastT      = 0;
let _mqMsgIdx     = 0;

function _mqAdvance(t, charW){
  if(_mqLastT === 0){
    _mqLastT  = t;
    _mqOffset = -(SW + charW);
  }
  const dt = Math.min(t - _mqLastT, 0.05);
  _mqLastT = t;

  _mqHueOffset += MARQUEE_PX_PER_SEC * MARQUEE_HUE_SPEED * dt;
  // Freeze scroll during game-pause OR user-tap-pause
  if(paused || _mqUserPaused) return;

  _mqOffset += MARQUEE_PX_PER_SEC * dt;

  const msg  = MARQUEE_MESSAGES[_mqMsgIdx].toUpperCase();
  const msgW = msg.length * charW;

  if(_mqOffset >= SW + msgW + SW){
    _mqMsgIdx = (_mqMsgIdx + 1) % MARQUEE_MESSAGES.length;
    _mqOffset = -(SW + charW);
  }
}

function drawTitle(t){
  const r   = R.title;
  const H   = r.h;
  const dotSz = Math.max(1, Math.floor((H - 2) / (7 + 6)));
  const step  = dotSz + 1;
  const charW = 5 * step + 2;
  const charH = 7 * step;
  const topY  = r.y + Math.floor((H - charH) / 2);

  _mqAdvance(t, charW);

  CTX.save();
  CTX.beginPath();
  CTX.rect(0, r.y, SW, H);
  CTX.clip();

  CTX.fillStyle = 'rgba(0,0,0,0.88)';
  CTX.fillRect(0, r.y, SW, H);
  CTX.strokeStyle = 'rgba(80,0,160,0.5)';
  CTX.lineWidth = 1;
  CTX.beginPath(); CTX.moveTo(0,r.y);   CTX.lineTo(SW,r.y);   CTX.stroke();
  CTX.beginPath(); CTX.moveTo(0,r.y+H); CTX.lineTo(SW,r.y+H); CTX.stroke();

  // ── GAME PAUSED — take over marquee with help carousel ───────────────
  if(paused && ui.gameStarted && !dead){
    // Help pages: each is a short string that fits the bar
    // Cycles every 3s per page; resets to page 0 each new pause session
    const helpPages = [
      '⏸  GAME PAUSED  — TAP ⏸ OR HERE TO RESUME',
      'CHOOSE A PIECE ABOVE  —  IT DROPS INSTANTLY',
      'TAP THE GHOST ON BOARD  —  SAME INSTANT PLACE',
      'SLIDER = SPEED  1.0 SLOW  TO  11 INSANE',
      'NO HOLES = CLEAN STREAK = BIGGER BONUS POT',
      'TETRIS = 4 LINES = STREAK MULTIPLIER GROWS',
      'AUTO MODE = AI PLAYS  —  NO HIGH SCORE THOUGH',
      'PIECE POT FILLS WITH CLEAN DROPS  NO HOLES',
      'TETRIS POT MULTIPLIES ON CONSECUTIVE TETRIS',
      'COLLECT YOUR POTS BY CLEARING LINES',
      'LEVEL UP EVERY 10 LINES  —  SPEED INCREASES',
      'RECEIPT SHOWS FULL SCORE BREAKDOWN AFTER GAME',
      '⏸  TAP ANYWHERE HERE OR THE PAUSE BUTTON  ⏸',
    ];
    // Derive page from elapsed pause time — 3s per page
    const elapsed = _gamePauseCount > 0
      ? (performance.now() - _gamePauseStartT) / 1000
      : 0;
    const pageIdx = Math.floor(elapsed / 3.0) % helpPages.length;
    const txt = helpPages[pageIdx].toUpperCase();

    // Hue cycles green→cyan for pause mode
    const hue = (120 + Math.sin(t*1.5)*30 + t*8) % 360;
    CTX.shadowColor = `hsl(${hue},100%,55%)`; CTX.shadowBlur = 8;
    _dmWordLabel(CTX, txt, 2, r.y + H*0.08, SW-4, H*0.84, `hsl(${hue},100%,65%)`);
    CTX.shadowBlur = 0;
    CTX.restore();
    return;
  }

  // ── USER TAP-PAUSED (sign freeze, game running) ───────────────────────
  if(_mqUserPaused){
    if(_mqPauseCount === 1){
      // First freeze: explain the feature
      const tips = [
        'SIGN FROZEN  —  TAP HERE AGAIN TO RESUME SCROLL',
        'TAP PIECES ABOVE  OR  GHOST ON BOARD TO PLACE',
        'MOVE BUTTONS SHIFT PIECE  —  ARROWS OR SWIPE',
        'SPEED SLIDER BOTTOM  —  DRAG TO SET TEMPO',
        'PAUSE BUTTON  —  FREEZES GAME + SHOWS HELP',
      ];
      const tidx = Math.floor(t * 0.38) % tips.length;
      CTX.shadowColor='#00ff88'; CTX.shadowBlur=6;
      _dmWordLabel(CTX, tips[tidx], 2, r.y+H*0.08, SW-4, H*0.84, '#00ff88');
      CTX.shadowBlur=0;
    } else {
      // Subsequent freezes: ghost the frozen message position, barely visible
      const msg = MARQUEE_MESSAGES[_mqMsgIdx].toUpperCase();
      const msgStartX = SW - _mqOffset;
      for(let ci=0; ci<msg.length; ci++){
        const glyph = DM_FONT[msg[ci]] || DM_FONT[' '];
        const cx0   = msgStartX + ci*charW;
        if(cx0+charW<0 || cx0>SW+20) continue;
        for(let col=0;col<5;col++){
          const colBits = glyph[col]||0;
          for(let row=0;row<7;row++){
            if(colBits&(1<<row)){
              CTX.fillStyle='rgba(0,60,0,0.15)';
              CTX.fillRect(Math.round(cx0+col*step), topY+row*step, dotSz, dotSz);
            }
          }
        }
      }
    }
    CTX.restore();
    return;
  }

  // ── NORMAL SCROLLING ──────────────────────────────────────────────────
  const msg       = MARQUEE_MESSAGES[_mqMsgIdx].toUpperCase();
  const msgStartX = SW - _mqOffset;
  const shear     = MARQUEE_SHEAR;

  for(let ci=0; ci<msg.length; ci++){
    const glyph = DM_FONT[msg[ci]] || DM_FONT[' '];
    const cx0   = msgStartX + ci*charW;
    if(cx0+charW+shear*charH<0) continue;
    if(cx0>SW+shear*charH+20)   continue;

    for(let col=0;col<5;col++){
      const colBits=glyph[col]||0;
      for(let row=0;row<7;row++){
        if(colBits&(1<<row)){
          const lean=(3-row)*step*shear;
          const px  =Math.round(cx0+col*step+lean);
          const py  =topY+row*step;
          const hue =((px+_mqHueOffset)*0.8)%360;
          CTX.fillStyle  =`hsl(${hue},100%,65%)`;
          CTX.shadowColor=`hsl(${hue},100%,65%)`;
          CTX.shadowBlur =dotSz*1.8;
          CTX.fillRect(px,py,dotSz,dotSz);
        }
      }
    }
  }
  CTX.shadowBlur=0;
  CTX.restore();
}


// ── Start screen ─────────────────────────────────────────────────────
function drawStartScreen(t){
  const bx=R.gx, by=R.gy, bw=R.gw, bh=R.gh;

  // ── background ───────────────────────────────────────────────────────
  CTX.fillStyle='rgba(0,0,0,0.92)';
  CTX.fillRect(bx, by, bw, bh);

  // ── seeded noise — deterministic per session so bars look the same ───
  // We use sin-based hash to get stable pseudo-random bar heights
  const barCount = 18;
  const barW = bw / barCount;
  const maxBarH = bh * 0.42;
  const barBaseY = by + bh * 0.88;

  // Each bar: a slow breathing sinusoid at different phase/speed
  for(let i=0; i<barCount; i++){
    const phase  = i * 1.3 + 0.7;
    const speed  = 0.4 + (i%5)*0.15;
    const frac   = 0.15 + 0.85 * Math.abs(Math.sin(t*speed + phase));
    const barH   = maxBarH * frac;
    const bBarX  = bx + i*barW + barW*0.08;
    const bBarW  = barW * 0.78;

    // LED segments — each segment is a small rect with gaps
    const segH = Math.max(3, bh*0.018);
    const segGap = Math.max(1, segH*0.35);
    const segStep = segH + segGap;
    const numSegs = Math.floor(barH / segStep);

    for(let s=0; s<numSegs; s++){
      const segFrac = s / Math.max(1, Math.floor(maxBarH/segStep));
      // Color: green→yellow→red like classic VU meter
      let r,g,b;
      if(segFrac < 0.6){
        r=0; g=200; b=40+(segFrac*80)|0;
      } else if(segFrac < 0.82){
        const f=(segFrac-0.6)/0.22;
        r=(f*255)|0; g=200; b=0;
      } else {
        const f=(segFrac-0.82)/0.18;
        r=255; g=(200*(1-f))|0; b=0;
      }
      const alpha = 0.7 + 0.3*frac;
      CTX.fillStyle=`rgba(${r},${g},${b},${alpha})`;
      CTX.shadowColor=`rgb(${r},${g},${b})`;
      CTX.shadowBlur = segH*1.2;
      const sy = barBaseY - (s+1)*segStep;
      CTX.fillRect(bBarX, sy, bBarW, segH);
    }
    // Peak dot — lingers at top
    const peakFrac = 0.2 + 0.78*Math.abs(Math.sin(t*speed*0.3 + phase + 1.1));
    const peakH   = maxBarH * Math.max(frac, peakFrac);
    const peakY   = barBaseY - peakH - segStep;
    CTX.fillStyle='rgba(255,255,100,0.9)';
    CTX.shadowColor='#ffff44'; CTX.shadowBlur=segH*2;
    CTX.fillRect(bBarX, peakY, bBarW, segH);
  }
  CTX.shadowBlur=0;

  // ── small random dancing side-bar clusters (stereo channel feel) ────
  for(let side=0; side<2; side++){
    const sx = side===0 ? bx+2 : bx+bw-barW*2.5;
    const miniCount=4;
    for(let i=0; i<miniCount; i++){
      const ph=i*2.1+side*5.3+0.4;
      const f=0.1+0.9*Math.abs(Math.sin(t*0.7+ph));
      const mh=bh*0.25*f;
      const mx2=sx+i*(barW*0.55);
      const segH2=Math.max(2,bh*0.012);
      const ns=Math.floor(mh/(segH2+1));
      for(let s2=0;s2<ns;s2++){
        const sf=s2/Math.max(1,ns);
        const col=sf<0.5?`rgba(0,180,255,0.8)`:`rgba(180,0,255,0.8)`;
        CTX.fillStyle=col; CTX.shadowColor=col; CTX.shadowBlur=4;
        CTX.fillRect(mx2, barBaseY-(s2+1)*(segH2+1), barW*0.45, segH2);
      }
    }
  }
  CTX.shadowBlur=0;

  // ── CELLTOWER title — rainbow DM font across top of box ─────────────
  const titleH = bh*0.10;
  const titleY = by + bh*0.04;
  // Draw each char with hue cycling
  const titleStr = 'CELLTOWER';
  const cw2 = bw*0.88/titleStr.length;
  for(let i=0;i<titleStr.length;i++){
    const hue=(i/titleStr.length*360 + t*60)%360;
    CTX.shadowColor=`hsl(${hue},100%,60%)`; CTX.shadowBlur=10;
    _dmWordLabel(CTX, titleStr[i], bx+bw*0.06+i*cw2, titleY, cw2*0.9, titleH, `hsl(${hue},100%,65%)`);
  }
  CTX.shadowBlur=0;

  // ── byline ───────────────────────────────────────────────────────────
  _dmWordLabel(CTX,'BY AARON HIGHTOWER',bx+bw*0.04,by+bh*0.16,bw*0.92,bh*0.042,'#7755aa');

  // ── TAP TO PLAY button — LED panel style ─────────────────────────────
  const btnW=bw*0.82, btnH=bh*0.13;
  const btnX=bx+(bw-btnW)/2, btnY=by+bh*0.47;
  const pulse=0.65+0.35*Math.sin(t*2.8);

  // Button body — dark panel with gradient border glow
  CTX.fillStyle='rgba(0,0,0,0.88)';
  roundRect(btnX,btnY,btnW,btnH,10); CTX.fill();

  // Animated border — two-tone cycling
  const hB1=(t*40)%360, hB2=(hB1+180)%360;
  CTX.strokeStyle=`hsla(${hB1},100%,60%,${pulse})`;
  CTX.lineWidth=2.5;
  roundRect(btnX,btnY,btnW,btnH,10); CTX.stroke();
  CTX.strokeStyle=`hsla(${hB2},100%,60%,${pulse*0.5})`;
  CTX.lineWidth=1;
  roundRect(btnX+3,btnY+3,btnW-6,btnH-6,8); CTX.stroke();

  // Button LED label — hue cycles
  const hT=(t*50+120)%360;
  CTX.shadowColor=`hsl(${hT},100%,65%)`; CTX.shadowBlur=12*pulse;
  _dmWordLabel(CTX,'TAP TO PLAY',btnX+btnW*0.06,btnY+btnH*0.12,btnW*0.88,btnH*0.76,`hsl(${hT},100%,70%)`);
  CTX.shadowBlur=0;

  // Store hit zone
  ui._startBtnX=btnX; ui._startBtnY=btnY;
  ui._startBtnW=btnW; ui._startBtnH=btnH;

  // ── hint lines ───────────────────────────────────────────────────────
  _dmWordLabel(CTX,'AUTO AVAILABLE AFTER START',bx+bw*0.04,by+bh*0.63,bw*0.92,bh*0.038,'#442266');
  _dmWordLabel(CTX,'AUTO SCORES: NO HIGH SCORE', bx+bw*0.04,by+bh*0.68,bw*0.92,bh*0.038,'#442266');
  _dmWordLabel(CTX,'PASTE A REPLAY TO WATCH',   bx+bw*0.04,by+bh*0.74,bw*0.92,bh*0.038,'#113a4a');

  // ── small oscilloscope-style wave strip at bottom ─────────────────
  const waveY = by+bh*0.76;
  const waveH = bh*0.08;
  CTX.strokeStyle='rgba(0,255,150,0.5)';
  CTX.lineWidth=1.5;
  CTX.beginPath();
  for(let px2=0;px2<bw;px2+=2){
    const phase2 = px2/bw*Math.PI*6;
    const amp = waveH*0.4*(0.5+0.5*Math.sin(t*1.8+px2*0.04));
    const wy = waveY + waveH/2 + amp*Math.sin(phase2+t*3.2);
    px2===0 ? CTX.moveTo(bx+px2,wy) : CTX.lineTo(bx+px2,wy);
  }
  CTX.stroke();
  // second wave, complementary color
  CTX.strokeStyle='rgba(180,0,255,0.35)';
  CTX.beginPath();
  for(let px2=0;px2<bw;px2+=2){
    const phase2=px2/bw*Math.PI*8+1.2;
    const amp=waveH*0.3*(0.4+0.6*Math.abs(Math.sin(t*2.1+px2*0.03)));
    const wy=waveY+waveH/2+amp*Math.sin(phase2-t*2.5);
    px2===0?CTX.moveTo(bx+px2,wy):CTX.lineTo(bx+px2,wy);
  }
  CTX.stroke();
}

let _identityScreen = false;
let _idOnComplete   = null;
let _idHitZones     = [];
const _EQ_N = 24;
const _eqSpike = new Float32Array(_EQ_N);
let _eqSpikeT = 0;

function _showIdentityCanvas(onComplete) {
  const stored = _getStoredIdentity();
  const pre = (stored && stored.name) ? Array.from(stored.name) : _genRandomName();
  _nameChars = pre.slice(0, 3);

function _confirmIdentityCanvas() {

  if(_idOnComplete){ _idOnComplete(); _idOnComplete = null; }
}

function drawIdentityScreen(t) {
  _idHitZones = [];

  // ── Background + scanlines ─────────────────────────────────────────────────
  CTX.fillStyle = '#05000f';
  CTX.fillRect(0, 0, SW, SH);
  CTX.fillStyle = 'rgba(0,0,0,0.18)';
  for(let y=0; y<SH; y+=3) CTX.fillRect(0, y, SW, 1);

  // ── Layout: derive everything from a single "unit" so it fits SW × SH ─────
  // unit = grid cell height. All other heights are multiples of unit.
  // Coefficient table (multiples of unit):
  //   topPad=0.3  title=2.0  titleGap=0.15  sub=0.6  subGap=0.3
  //   slot=2.2    slotGap=0.3   grid=GROW    gridGap=0.25
  //   btn=0.9     eqH=1.5
  const GCOLS  = 10;
  const GROW   = Math.ceil(_B92_CHARS.length / GCOLS);
  const K_FIXED = 0.3+2.0+0.15+0.6+0.3+2.2+0.3+0.25+0.9+1.5; // fixed-element sum
  const K_TOTAL = K_FIXED + GROW;

  // unit constrained by height
  const unitByH = SH / K_TOTAL;
  // unit constrained by width (cells fill SW with a small pad)
  const pad     = Math.max(4, Math.round(Math.min(SW,SH) * 0.015));
  const cellWmax= Math.floor((SW - pad*2) / GCOLS);
  const unitByW = cellWmax * 0.88; // cellH ≈ cellW * 0.88

  const unit  = Math.min(unitByH, unitByW);
  const cellH = Math.round(unit);
  const cellW = Math.min(cellWmax, Math.round(unit / 0.88));
  const gridTW= GCOLS * cellW;
  const gridX = Math.round((SW - gridTW) / 2);

  // Derived heights
  const titleH = Math.round(unit * 2.0);
  const subH   = Math.round(unit * 0.6);
  const slotSz = Math.round(unit * 2.2);
  const btnH2  = Math.round(unit * 0.9);
  const eqH    = Math.round(unit * 1.5);

  // Y positions (top-to-bottom)
  const titleY = Math.round(unit * 0.3);
  const subY   = titleY + titleH + Math.round(unit * 0.15);
  const slotY  = subY   + subH   + Math.round(unit * 0.3);
  const gridY  = slotY  + slotSz + Math.round(unit * 0.3);
  const btnY2  = gridY  + GROW*cellH + Math.round(unit * 0.25);
  const eqY    = SH - eqH;

  // ── Equalizer bars ─────────────────────────────────────────────────────────
  const bW   = SW / _EQ_N;
  const spDt = t - _eqSpikeT;
  for(let i=0; i<_EQ_N; i++){
    const w1   = 0.38 + 0.38*Math.sin(t*1.9  + i*0.55);
    const w2   = 0.18 + 0.18*Math.sin(t*3.3  + i*0.88 + 1.4);
    const w3   = 0.10 *Math.sin(t*5.7  + i*0.31 + 2.1);
    const spk  = Math.max(0, _eqSpike[i] - spDt*2.8);
    const frac = Math.min(1, Math.abs(w1+w2+w3) + spk);
    const h    = frac * eqH;
    const by   = eqY + eqH - h;
    const gr   = CTX.createLinearGradient(0, by, 0, eqY+eqH);
    gr.addColorStop(0,    `rgba(255,${Math.round(80+frac*80)},0,${0.5+frac*0.5})`);
    gr.addColorStop(0.45, `rgba(140,0,220,${0.35+frac*0.35})`);
    gr.addColorStop(1,    `rgba(0,220,200,0.55)`);
    CTX.fillStyle = gr;
    CTX.fillRect(i*bW+1, by, bW-2, h);
    if(h > 3){ CTX.fillStyle=`rgba(255,220,120,${0.55+frac*0.45})`; CTX.fillRect(i*bW+1, by, bW-2, 3); }
  }

  // ── Title ──────────────────────────────────────────────────────────────────
  CTX.save();
  CTX.shadowColor='#cc4400'; CTX.shadowBlur=28;
  _dmWordLabel(CTX,'CELLTOWER',SW*0.04,titleY,SW*0.92,titleH,'#ff7700');
  CTX.shadowColor='#ff8800'; CTX.shadowBlur=14;
  _dmWordLabel(CTX,'CELLTOWER',SW*0.04,titleY,SW*0.92,titleH,'#ffaa33');
  CTX.shadowBlur=0; CTX.restore();

  CTX.save();
  CTX.shadowColor='#00ffcc'; CTX.shadowBlur=6;
  _dmWordLabel(CTX,'THE HIGH TOWER DISTRICT · FRESNO CA',SW*0.04,subY,SW*0.92,subH,'#00ddaa');
  CTX.shadowBlur=0; CTX.restore();

  // ── Name slots ─────────────────────────────────────────────────────────────
  const slotGap = Math.round(slotSz * 0.18);
  const slot0X  = Math.round((SW - (3*slotSz + 2*slotGap)) / 2);
  for(let i=0; i<3; i++){
    const sx = slot0X + i*(slotSz+slotGap);
    const ch = _nameChars[i];
    const pulse = 0.55 + 0.45*Math.sin(t*3.8 + i*1.3);
    CTX.fillStyle = ch ? 'rgba(255,110,0,0.14)' : 'rgba(255,255,255,0.03)';
    CTX.fillRect(sx, slotY, slotSz, slotSz);
    CTX.save();
    CTX.shadowColor=ch?'#ff6600':'#223344'; CTX.shadowBlur=ch?16:5;
    CTX.strokeStyle=ch?`rgba(255,${Math.round(100+pulse*100)},0,${0.7+pulse*0.3})`:`rgba(60,90,110,${0.25+pulse*0.12})`;
    CTX.lineWidth=ch?2:1;
    CTX.strokeRect(sx+0.5,slotY+0.5,slotSz-1,slotSz-1);
    CTX.restore();
    const chSz=Math.round(slotSz*0.62);
    CTX.save();
    CTX.font=`900 ${chSz}px "Arial Black","Impact",Arial,sans-serif`;
    CTX.textAlign='center'; CTX.textBaseline='middle';
    if(ch){CTX.shadowColor='#ff8800';CTX.shadowBlur=chSz*0.4;CTX.fillStyle='#ffdd55';}
    else  {CTX.fillStyle='rgba(80,100,120,0.35)';}
    CTX.fillText(ch||'_', sx+slotSz/2, slotY+slotSz/2);
    CTX.restore();
  }

  // ── Char grid ──────────────────────────────────────────────────────────────
  const chFsz = Math.round(cellH * 0.5);
  for(let i=0; i<_B92_CHARS.length; i++){
    const col=i%GCOLS, row=Math.floor(i/GCOLS);
    const cx=gridX+col*cellW, cy=gridY+row*cellH;
    const ch=_B92_CHARS[i];
    const isUp=ch>='A'&&ch<='Z', isDg=ch>='0'&&ch<='9', isLo=ch>='a'&&ch<='z';
    const col0=isUp?'rgba(230,240,255,0.78)':isDg?'rgba(0,255,200,0.78)':isLo?'rgba(160,200,255,0.65)':'rgba(200,140,255,0.65)';
    CTX.fillStyle='rgba(255,255,255,0.025)';
    CTX.fillRect(cx+1,cy+1,cellW-2,cellH-2);
    CTX.font=`600 ${chFsz}px "Courier New",monospace`;
    CTX.textAlign='center'; CTX.textBaseline='middle';
    CTX.fillStyle=col0;
    CTX.fillText(ch, cx+cellW/2, cy+cellH/2);
    _idHitZones.push({type:'char',ch,x:cx,y:cy,w:cellW,h:cellH});
  }

  // ── Buttons ────────────────────────────────────────────────────────────────
  const bkW  = Math.round(SW*0.18);
  const playX= pad + bkW + Math.round(SW*0.025);
  const playW= SW - pad - playX;

  CTX.fillStyle='rgba(50,15,0,0.7)'; CTX.fillRect(pad,btnY2,bkW,btnH2);
  CTX.strokeStyle='rgba(255,80,0,0.35)'; CTX.lineWidth=1; CTX.strokeRect(pad,btnY2,bkW,btnH2);
  CTX.font=`700 ${Math.round(btnH2*0.5)}px monospace`; CTX.textAlign='center'; CTX.textBaseline='middle';
  CTX.fillStyle='#ff6600'; CTX.fillText('⌫', pad+bkW/2, btnY2+btnH2/2);
  _idHitZones.push({type:'backspace',x:pad,y:btnY2,w:bkW,h:btnH2});

  const pp=0.72+0.28*Math.sin(t*2.1);
  const pgr=CTX.createLinearGradient(playX,0,playX+playW,0);
  pgr.addColorStop(0,`rgba(160,50,0,${pp})`); pgr.addColorStop(1,`rgba(240,100,0,${pp})`);
  CTX.fillStyle=pgr; CTX.fillRect(playX,btnY2,playW,btnH2);
  CTX.save();
  CTX.shadowColor='#ff8800'; CTX.shadowBlur=14*pp;
  CTX.strokeStyle=`rgba(255,160,40,${pp})`; CTX.lineWidth=1.5;
  CTX.strokeRect(playX,btnY2,playW,btnH2); CTX.restore();
  CTX.save();
  CTX.shadowColor='rgba(0,0,0,0.9)'; CTX.shadowBlur=0; CTX.shadowOffsetX=1; CTX.shadowOffsetY=1;
  CTX.font=`900 ${Math.round(btnH2*0.46)}px "Arial Black",Arial,sans-serif`;
  CTX.textAlign='center'; CTX.textBaseline='middle'; CTX.fillStyle='#fff';
  CTX.fillText('PLAY', playX+playW/2, btnY2+btnH2/2); CTX.restore();
  _idHitZones.push({type:'play',x:playX,y:btnY2,w:playW,h:btnH2});
}

function drawTicker(t){
  const r = R.lTicker;
  panel(r.x, r.y, r.w, r.h);
  const n = ui.tickers.length;
  if(n===0) return;
  const lineH = Math.max(9, Math.min(18, r.h / 12));
  const fontSize = Math.max(6, lineH * 0.72);
  CTX.font = F(FONT_SMALL, fontSize);
  CTX.textBaseline = 'middle';
  const maxVisible = Math.floor(r.h / lineH);
  const start = Math.max(0, n - maxVisible);

  // Semantic tokenizer — same logic as _txDraw but runs on main CTX
  function _tickerWordCol(w, ageFrac){
    const lum = Math.max(45, 85 - ageFrac * 40);
    if(/^BLOCKED$/i.test(w))  return '#ff4444';
    if(/^(READY)$/i.test(w))  return '#ffee00';
    if(/^(LVL)$/i.test(w))    return '#ffdd00';
    if(/^(CS|CS★)$/i.test(w)) return '#00ffff';
    if(/^(PERFECT|ATARI|TRIBUTE|TOWERS|CLEARED|OG)$/i.test(w)) return '#ffd700';
    if(/^[LT]$/.test(w))      return '#44ff88';
    if(/^H$/.test(w))         return '#ff7733';
    if(/^[🔥🥶🧊❄️★🏆✨👾⛰️✅]/.test(w)) return `hsl(${(ageFrac*180)%360},100%,${lum}%)`;
    return `hsl(${(ageFrac*120+60)%360},70%,${lum}%)`;
  }
  function _tickerSegs(text, ageFrac){
    const segs=[];
    const words=text.split(/\s+/);
    for(let wi=0;wi<words.length;wi++){
      if(wi>0) segs.push({t:' ', col:'#666666'});
      const w=words[wi]; if(!w) continue;
      let cm;
      if((cm=w.match(/^([+\-]?[0-9][0-9.,]*)(k?)$/i))){
        segs.push({t:w, col:'#ffffff'});
      } else if((cm=w.match(/^([+\-]?[0-9][0-9.,]*)(CS[★]?)$/i))){
        segs.push({t:cm[1],col:'#ffffff'});
        segs.push({t:cm[2],col:'#00ffff'});
      } else if((cm=w.match(/^([+\-]?[0-9][0-9.,]*)([LT])$/i))){
        segs.push({t:cm[1],col:'#ffffff'});
        segs.push({t:cm[2],col:'#44ff88'});
      } else if((cm=w.match(/^([+\-]?[0-9][0-9.,]*)(H)$/i))){
        segs.push({t:cm[1],col:'#ffffff'});
        segs.push({t:cm[2],col:'#ff7733'});
      } else {
        const wCol=_tickerWordCol(w,ageFrac);
        let run='',runIsDigit=false;
        for(const ch of w){
          const isD=/[0-9+\-.,]/.test(ch);
          if(run===''){run=ch;runIsDigit=isD;}
          else if(isD===runIsDigit){run+=ch;}
          else{segs.push({t:run,col:runIsDigit?'#ffffff':wCol});run=ch;runIsDigit=isD;}
        }
        if(run) segs.push({t:run,col:runIsDigit?'#ffffff':wCol});
      }
    }
    return segs;
  }

  for(let i=start; i<n; i++){
    const item = ui.tickers[i];
    const age = n - 1 - i;
    const ageFrac = n > 1 ? age / (n - 1) : 0;
    const iy = r.y + r.h - (n - i) * lineH + lineH / 2;
    if(iy <= r.y || iy >= r.y + r.h) continue;

    CTX.shadowColor = 'rgba(0,0,0,0.7)';
    CTX.shadowBlur = 2;

    // Draw segments right-to-left
    const segs = _tickerSegs(item.text, ageFrac);
    let xRight = r.x + r.w - 3;
    CTX.textAlign = 'right';
    for(let s=segs.length-1; s>=0; s--){
      const seg = segs[s];
      CTX.fillStyle = seg.col;
      CTX.globalAlpha = 1 - ageFrac * 0.55; // older rows fade slightly
      CTX.fillText(seg.t, xRight, iy);
      xRight -= CTX.measureText(seg.t).width;
    }
  }
  CTX.shadowBlur = 0;
  CTX.globalAlpha = 1;
}

function drawNextPiece(t){

  if(!nxt) return;
  const cc = nxt.c;
  // Fixed 4×4 reference so every piece renders at identical cell size
  const s = Math.min(Math.floor(r.w * 0.70 / 4), Math.floor(r.h * 0.65 / 4));
  const ox = r.x + (r.w - cc[0].length*s)/2;

      if(cc[row][col]) drawCell(CTX, ox+col*s, oy+row*s, s, nxt.rgb, t);
}

function drawPauseBox(t){
  const r = R.rPause;
  const icX = r.x + r.w/2, icSz = Math.max(10, r.h*0.38);
  if(dead){
    panel(r.x, r.y, r.w, r.h, '#330000');
    label('GAME OVER', r.x, r.y+r.h*0.06, r.w, '#ff4444', Math.max(5,r.h*0.20));
    if(!_replaySource) _drawPauseIcon('▶', icX, r.y+r.h*0.76, icSz);
  } else if(paused){
    panel(r.x, r.y, r.w, r.h, C.green);
    const blinkOn = Math.floor(t * 2) % 2 === 0;
    const resumeColor = blinkOn ? C.green : 'rgba(0,255,136,0.60)';
    label('RESUME', r.x, r.y+r.h*0.08, r.w, resumeColor, Math.max(7,r.h*0.22));
    _drawPauseIcon('▶', icX, r.y+r.h*0.68, Math.max(10,r.h*0.35));
  } else if(_replayMode){
    panel(r.x, r.y, r.w, r.h);
    label('REPLAY', r.x, r.y+r.h*0.08, r.w, '#00ccff', Math.max(5,r.h*0.20));
    val(_replayIdx+'/'+_replayPlacements.length, r.x, r.y+r.h*0.56, r.w, 'rgba(0,180,220,0.80)', Math.max(7,r.h*0.26));
    _drawPauseIcon(_replayPaused?'▶':'⏸', icX, r.y+r.h*0.82, Math.max(7,r.h*0.20));
  } else {
    panel(r.x, r.y, r.w, r.h, C.border);
    label('PAUSE', r.x, r.y+r.h*0.08, r.w, C.purple, Math.max(7,r.h*0.22));
    _drawPauseIcon('⏸', icX, r.y+r.h*0.68, Math.max(10,r.h*0.35));

}

function drawTBonusBox(t){

// ── Playfield ────────────────────────────────────────────────────────
function drawPlayfield(t){
  const gx = R.gx, gy = R.gy, gw = R.gw, gh = R.gh;

  // Background
  const bg2 = CTX.createLinearGradient(gx,gy,gx+gw,gy+gh);
  bg2.addColorStop(0,'#080018'); bg2.addColorStop(1,'#050015');
  CTX.fillStyle=bg2; CTX.fillRect(gx,gy,gw,gh);

  // Grid lines
  CTX.strokeStyle='rgba(80,0,160,0.25)'; CTX.lineWidth=0.5;
  for(let r=0;r<=25;r++){
    CTX.beginPath(); CTX.moveTo(gx,gy+r*CELL); CTX.lineTo(gx+gw,gy+r*CELL); CTX.stroke();
  }
  for(let c=0;c<=10;c++){
    CTX.beginPath(); CTX.moveTo(gx+c*CELL,gy); CTX.lineTo(gx+c*CELL,gy+gh); CTX.stroke();
  }

  // Locked cells
  if(board){
    for(let r=0;r<25;r++) for(let c=0;c<10;c++){
      if(board[r][c] && !explodedCells.has(`${r},${c}`))
        drawCell(CTX, gx+c*CELL, gy+r*CELL, CELL, board[r][c], t);
    }
  }

  // Explosion particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.07; p.life-=p.decay;
    if(p.life<=0){particles.splice(i,1);continue;}
    CTX.globalAlpha=p.life;
    CTX.fillStyle=`rgb(${p.r},${p.g},${p.b})`;
    CTX.fillRect(gx+p.x, gy+p.y, p.sz, p.sz);
  }
  CTX.globalAlpha=1;

  // Ghost + current piece
  if(cur && !dead && placements){
    CTX.save();
    CTX.beginPath(); CTX.rect(gx,gy,gw,gh); CTX.clip();
    drawGhosts(t, gx, gy);
    // Current piece
    for(let r=0;r<cur.c.length;r++) for(let c=0;c<cur.c[r].length;c++){
      if(cur.c[r][c]) drawCell(CTX, gx+(cx+c)*CELL, gy+(cy+r)*CELL, CELL, cur.rgb, t);
    }
    CTX.restore();
  }

  // 5-pixel concentric border outside cells: black-white-black-white-black (inside → out).
  // Each ring is a 1px strokeRect centered at gx-(p+0.5) — entirely outside the cell area.
  // White rings pulse; black rings stay solid to maintain crisp pixel-art edge.
  {
    const bPulse = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t * Math.PI * 0.5));
    CTX.save();
    CTX.lineWidth = 1;
    for (let p = 0; p < 5; p++) {
      const ofs = -(p + 0.5);  // negative = outside cells; p=0 touches cell edge
      const isWhite = (p === 1 || p === 3);
      CTX.strokeStyle = isWhite
        ? `rgba(255,255,255,${bPulse.toFixed(3)})`
        : 'rgba(0,0,0,1)';
      CTX.strokeRect(gx + ofs, gy + ofs, gw - 2 * ofs, gh - 2 * ofs);
    }
    CTX.restore();
  }

  drawVerificationStripe(gx, gy, gw, gh);

  // READY/status text in bottom-left of playfield
}

function drawGhosts(t, gx, gy){
  if(!placements) return;
  labelPositions = []; // reset each frame so positions stay current
  const elapsed = AT - moveStartTime;

  // Hard render guard: build usedCells set as we draw — if any ghost's cells
  // overlap with an already-drawn ghost, skip it entirely. Prevents visual
  // overlap regardless of how placements[] was constructed.
  const _drawnCells = new Set();

  for(let i=0;i<placements.length;i++){
    const p = placements[i];
    if(!p) continue;
    // Overlap guard
    const _pfp = footprint(p.c, p.x, p.dropY);
    if(setsOverlap(_pfp, _drawnCells)) continue; // would overlap — skip
    _pfp.forEach(k=>_drawnCells.add(k));

    // Fade logic
    let alpha;
    if(!playerHasMoved){ alpha=0.38; }
    else if(elapsed<0.5){ alpha = (i===0 && p.fpKey===_straightFp) ? 0.38 : 0; }
    else { alpha = 0.38 * Math.min(1, (elapsed-0.5)/0.5); }
    // During navigation: fade all non-selected ghosts to near-invisible over 4 frames (~64ms)
    if(selectedPlacementIdx !== null){
      const navElapsed = AT - _navStartT;
      const fadeFrac = Math.min(1, navElapsed / 0.064); // 0→1 over 64ms
      if(i === selectedPlacementIdx){
        alpha = Math.min(alpha + 0.3, 0.75); // selected stays bright
      } else {
        alpha = alpha * (1 - fadeFrac * 0.95); // others fade to 5% of normal
      }
    }
    if(alpha <= 0) continue;

    const [r0,g0,b0] = cur ? cur.rgb : [100,100,100];

    CTX.save();
    CTX.globalAlpha = 1.0; // never change globalAlpha — use rgba() for all transparency

    // Alternating fill brightness: pieces 1&3 brighter, 2&4 dimmer
    const fillA = (i % 2 === 0) ? (alpha * 0.50) : (alpha * 0.18);
    const outA  = alpha * 0.9; // outline tracks ghost alpha

    // ── LAYER 1: Color fill ───────────────────────────────────────────────
    CTX.fillStyle = `rgba(${r0},${g0},${b0},${fillA.toFixed(3)})`;
    for(let r=0;r<p.c.length;r++) for(let c=0;c<p.c[r].length;c++){
      if(!p.c[r][c]) continue;
      CTX.fillRect(gx+(p.x+c)*CELL, gy+(p.dropY+r)*CELL, CELL, CELL);
    }

    // ── LAYER 2: Outline ──────────────────────────────────────────────────
    const lw = Math.max(2, CELL * 0.15);
    const ins = lw * 0.5;
    CTX.strokeStyle = `rgba(255,255,255,${outA.toFixed(3)})`;
    CTX.lineWidth = lw;
    CTX.lineJoin = 'miter';
    CTX.lineCap = 'butt';
    CTX.beginPath();
    const rows = p.c.length, cols = (p.c[0]||[]).length;

    // Horizontal edges: draw cell-by-cell, alternating alpha per cell column
    for(let r=0; r<=rows; r++){
      for(let c=0; c<cols; c++){
        const above = r>0    && p.c[r-1] && p.c[r-1][c];
        const below = r<rows && p.c[r]   && p.c[r][c];
        if(!((above && !below) || (!above && below))) continue;
        const topEdge = (!above && below);
        const y = gy+(p.dropY+r)*CELL + (topEdge ? ins : -ins);
        CTX.globalAlpha = alpha * ((c % 2 === 0) ? 0.90 : 0.65);
        CTX.beginPath();
        CTX.moveTo(gx+(p.x+c)*CELL,      y);
        CTX.lineTo(gx+(p.x+c+1)*CELL,    y);
        CTX.stroke();
      }
    }

    // Vertical edges: draw cell-by-cell, alternating alpha per cell row
    for(let c=0; c<=cols; c++){
      for(let r=0; r<rows; r++){
        const left  = c>0    && p.c[r] && p.c[r][c-1];
        const right = c<cols && p.c[r] && p.c[r][c];
        if(!((left && !right) || (!left && right))) continue;
        const leftEdge = (!left && right);
        const x = gx+(p.x+c)*CELL + (leftEdge ? ins : -ins);
        CTX.globalAlpha = alpha * ((r % 2 === 0) ? 0.90 : 0.65);
        CTX.beginPath();
        CTX.moveTo(x, gy+(p.dropY+r)*CELL);
        CTX.lineTo(x, gy+(p.dropY+r+1)*CELL);
        CTX.stroke();
      }
    }

    // Number badge — nearest-point snap (suppressed when placement is unlabelled)
    if(p.hideLabel){ CTX.restore(); continue; }
    let minR=99,maxR=0,minC=99,maxC=0;
    for(let r=0;r<p.c.length;r++) for(let c=0;c<p.c[r].length;c++){
      if(p.c[r][c]){minR=Math.min(minR,r);maxR=Math.max(maxR,r);minC=Math.min(minC,c);maxC=Math.max(maxC,c);}
    }
    // True nearest-point snap: find centroid, then find closest point
    // in the set of filled-cell centers. If two cells are equidistant,
    // the average of their centers is used — landing on the midpoint between them.
    const rawCX = (minC + maxC) / 2 + 0.5;
    const rawCY = (minR + maxR) / 2 + 0.5;
    // Collect all filled cell centers and their distances to centroid
    const filled = [];
    for(let r=0;r<p.c.length;r++) for(let c=0;c<p.c[r].length;c++){
      if(!p.c[r][c]) continue;
      const fx = c + 0.5, fy = r + 0.5;
      const d = (fx-rawCX)**2 + (fy-rawCY)**2;
      filled.push({fx, fy, d});
    }
    // Find minimum distance
    const minD = filled.reduce((m,f)=>Math.min(m,f.d), Infinity);
    // Gather all cells at (approximately) that distance — tolerance for float equality
    const tol = minD * 0.01 + 0.0001;
    const nearest = filled.filter(f => f.d <= minD + tol);
    // Average their centers — if one cell, lands on its center;
    // if two equidistant, lands on their midpoint
    const avgX = nearest.reduce((s,f)=>s+f.fx,0) / nearest.length;
    const avgY = nearest.reduce((s,f)=>s+f.fy,0) / nearest.length;
    const numX = gx + (p.x + avgX) * CELL;
    const numY = gy + (p.dropY + avgY) * CELL;

    // ── Save to labelPositions for tap detection ─────────────────────────
    labelPositions[i] = {x: numX, y: numY, idx: i};

    const numSz = Math.max(14, CELL*1.2);

    const numA = Math.min(1, alpha * 1.6);
    CTX.globalAlpha = 1.0;
    CTX.font = `900 ${Math.round(numSz)}px "Arial Black","Impact",sans-serif`;
    CTX.textAlign = 'center';
    CTX.textBaseline = 'middle';
    CTX.shadowBlur = 0;

    const dropOff = Math.max(1, Math.round(numSz * 0.08));
    CTX.fillStyle = `rgba(0,0,0,${(numA*0.6).toFixed(3)})`;
    CTX.fillText(String(i+1), numX + dropOff, numY + dropOff);

    CTX.fillStyle = `rgba(255,255,255,${numA.toFixed(3)})`;
    CTX.fillText(String(i+1), numX, numY);

    CTX.restore();
  }
}

let _straightFp = null; // set by calcPlacements

function drawPlayfieldStatus(t, gx, gy, gw, gh){
  if(!ui.gameStarted || dead) return;
  const sz = Math.max(7, CELL*0.55);
  CTX.font = F(FONT_SMALL, sz);
  CTX.textAlign='left'; CTX.textBaseline='bottom';
  CTX.fillStyle='#00ff88'; CTX.shadowColor='#00ff88'; CTX.shadowBlur=4;
  // Show last ticker item as status
  if(ui.tickers.length>0){
    const last = ui.tickers[ui.tickers.length-1];
    CTX.fillText(last.text, gx+4, gy+gh-4);
  }
  CTX.shadowBlur=0;
}

// ── Piece row ────────────────────────────────────────────────────────
function drawPieceRow(t){
  const r   = R.pieces;
  const GAP = R.GAP;
  const PW  = Math.round((r.w - 3*GAP) / 4);

  // ── TETRIS MEGA-BUTTON — full width, single placement ─────────────────────
  // Tetris state: derived from placements — slot 0 filled, rest null. No flag dependency.
  const _isTetrisMode = !_replayMode && !!(placements && placements[0] && !placements[1] && !placements[2] && !placements[3]);
  if(_isTetrisMode){
    // Draw one giant glowing button covering all four slots
    const bx = r.x, by = r.y, bw = r.w, bh = r.h;
    const br = 12;

    // Dark background
    CTX.fillStyle='rgba(0,0,0,0.88)';
    roundRect(bx,by,bw,bh,br); CTX.fill();

    // Pulsing multi-layer border
    const pulse = 0.55 + 0.45*Math.sin(t*3.5);
    const pulse2= 0.55 + 0.45*Math.sin(t*3.5+Math.PI);
    CTX.strokeStyle=`rgba(0,220,255,${pulse})`; CTX.lineWidth=3;
    roundRect(bx,by,bw,bh,br); CTX.stroke();
    CTX.strokeStyle=`rgba(255,0,200,${pulse2})`; CTX.lineWidth=1.2;
    roundRect(bx+3,by+3,bw-6,bh-6,br-2); CTX.stroke();

    // Inner glow wash
    const grd=CTX.createLinearGradient(bx,by,bx+bw,by+bh);
    grd.addColorStop(0,`rgba(0,100,180,${0.12*pulse})`);
    grd.addColorStop(0.5,`rgba(180,0,180,${0.10*pulse2})`);
    grd.addColorStop(1,`rgba(0,180,100,${0.12*pulse})`);
    CTX.fillStyle=grd;
    roundRect(bx,by,bw,bh,br); CTX.fill();

    // TETRIS text — DM dot-matrix font with fast-moving hue wash
    // Compute char layout
    const dotSz = Math.max(2, Math.floor((bh*0.52) / (7+6)));
    const step  = dotSz+1;
    const charW = 5*step+2;
    const charH = 7*step;
    const word  = 'TETRIS';
    const totalTxtW = word.length * charW;
    const startX = bx + (bw-totalTxtW)/2;
    const startY = by + (bh-charH)/2;

    // Hue moves quickly left-to-right independent of text position
    const HUE_SPEED = 200; // px/sec equivalent
    const hueBase = (_mqHueOffset * 1.6 + t * HUE_SPEED * 0.5);

    CTX.save();
    CTX.beginPath(); CTX.rect(bx,by,bw,bh); CTX.clip();

    for(let ci=0;ci<word.length;ci++){
      const glyph = DM_FONT[word[ci]] || DM_FONT[' '];
      const cx0   = startX + ci*charW;
      for(let col=0;col<5;col++){
        const colBits = glyph[col]||0;
        for(let row=0;row<7;row++){
          if(colBits&(1<<row)){
            const px = Math.round(cx0 + col*step);
            const py = startY + row*step;
            const hue = ((px + hueBase)*1.2)%360;
            const lum = 60+10*Math.sin(t*4+ci);
            CTX.fillStyle  =`hsl(${hue},100%,${lum}%)`;
            CTX.shadowColor=`hsl(${hue},100%,${lum}%)`;
            CTX.shadowBlur = dotSz*2.5;
            CTX.fillRect(px, py, dotSz, dotSz);
          }
        }
      }
    }
    CTX.shadowBlur=0;
    CTX.restore();

    // Register hit zone over full row
    hitZones = hitZones.filter(z=>z.id!=='tetris'&&z.id!=='piece0'&&z.id!=='piece1'&&z.id!=='piece2'&&z.id!=='piece3');
    addHit('tetris', bx, by, bw, bh);
    return;
  }

  // ── REPLAY TRANSPORT BAR ─────────────────────────────────────────────────
  if(_replayMode || (_replaySource && dead)){
    const GAP3=R.GAP, PW3=Math.round((r.w-3*GAP3)/4);
    hitZones=hitZones.filter(z=>!z.id.startsWith('replay_')&&z.id!=='tetris'&&z.id!=='piece0'&&z.id!=='piece1'&&z.id!=='piece2'&&z.id!=='piece3');
    const _icons=['◀◀','▶','⏸','⏹'];
    const _ids  =['replay_back','replay_play','replay_pause','replay_stop'];
    // Dim play when not paused; dim pause when paused or dead
    const _dims =[false, _replayMode&&!_replayPaused, _replayMode&&(_replayPaused||dead), false];
    for(let i=0;i<4;i++){
      const bx2=r.x+i*(PW3+GAP3), by2=r.y;
      CTX.globalAlpha=_dims[i]?0.30:1.0;
      panel(bx2,by2,PW3,r.h,'#002233');
      addHit(_ids[i],bx2,by2,PW3,r.h);
      _drawPauseIcon(_icons[i],bx2+PW3/2,by2+r.h*0.55,Math.max(8,r.h*0.46));
    }
    CTX.globalAlpha=1;
    return;
  }

  // ── NORMAL FOUR SLOTS — re-register hit zones every frame ─────────────────
  const GAP2 = R.GAP;
  const PW2  = Math.round((r.w - 3*GAP2) / 4);
  hitZones = hitZones.filter(z=>z.id!=='tetris'&&z.id!=='piece0'&&z.id!=='piece1'&&z.id!=='piece2'&&z.id!=='piece3');
  for(let i=0;i<4;i++){
    addHit('piece'+i, r.x + i*(PW2+GAP2), r.y, PW2, r.h);
  }

  // Fixed 4×4 reference so all pieces and rotations render at identical cell size
  const _uniS = Math.max(2, Math.min(Math.floor(PW2 * 0.60 / 4), Math.floor(r.h * 0.75 / 4)));

  for(let i=0;i<4;i++){
    const px = r.x + i*(PW2+GAP2);
    const py = r.y;
    const [rc,gc,bc] = cur ? cur.rgb : [120,120,120];
    const isSelected = (placements && placements[i] && selectedPlacementIdx===i);
    const borderColor = isSelected ? `rgb(${rc},${gc},${bc})` : C.border;
    // Fade non-selected buttons during navigation
    const navElapsedBtn = selectedPlacementIdx !== null ? Math.min(1,(AT-_navStartT)/0.064) : 0;
    const btnAlpha = selectedPlacementIdx !== null && !isSelected ? (1 - navElapsedBtn*0.85) : 1.0;
    CTX.globalAlpha = btnAlpha;
    panel(px, py, PW2, r.h, borderColor);

    const p = placements ? placements[i] : null;
    if(p && cur){
      const cc = p.c;
      const s = _uniS;
      if(s < 2) continue;

      const pieceW = cc[0].length * s;
      const pieceH = cc.length * s;
      const ox = px + (PW2 - pieceW)/2;
      const oy = py + (r.h - pieceH)/2 - s*0.3;

      CTX.fillStyle = `rgb(${rc},${gc},${bc})`;
      CTX.globalAlpha = 0.18;
      for(let row=0;row<cc.length;row++) for(let col=0;col<cc[row].length;col++){
        if(!cc[row][col]) continue;
        CTX.fillRect(ox+col*s+1, oy+row*s+1, s-2, s-2);
      }

      CTX.globalAlpha = 0.75;
      CTX.strokeStyle = '#ffffff';
      CTX.lineWidth = Math.max(1, s * 0.1);
      for(let row=0;row<cc.length;row++) for(let col=0;col<cc[row].length;col++){
        if(!cc[row][col]) continue;
        const cx2 = ox+col*s, cy2 = oy+row*s;
        const hU = row>0 && cc[row-1][col];
        const hD = row<cc.length-1 && cc[row+1] && cc[row+1][col];
        const hL = col>0 && cc[row][col-1];
        const hR = col<cc[row].length-1 && cc[row][col+1];
        CTX.beginPath();
        if(!hU){ CTX.moveTo(cx2,   cy2);   CTX.lineTo(cx2+s, cy2); }
        if(!hD){ CTX.moveTo(cx2,   cy2+s); CTX.lineTo(cx2+s, cy2+s); }
        if(!hL){ CTX.moveTo(cx2,   cy2);   CTX.lineTo(cx2,   cy2+s); }
        if(!hR){ CTX.moveTo(cx2+s, cy2);   CTX.lineTo(cx2+s, cy2+s); }
        CTX.stroke();
      }

      CTX.globalAlpha = 0.38;
      CTX.lineWidth = Math.max(0.5, s * 0.05);
      for(let row=0;row<cc.length;row++) for(let col=0;col<cc[row].length;col++){
        if(!cc[row][col]) continue;
        const cx2 = ox+col*s, cy2 = oy+row*s;
        const hU = row>0 && cc[row-1][col];
        const hD = row<cc.length-1 && cc[row+1] && cc[row+1][col];
        const hL = col>0 && cc[row][col-1];
        const hR = col<cc[row].length-1 && cc[row][col+1];
        CTX.beginPath();
        if(hU){ CTX.moveTo(cx2,   cy2);   CTX.lineTo(cx2+s, cy2); }
        if(hD){ CTX.moveTo(cx2,   cy2+s); CTX.lineTo(cx2+s, cy2+s); }
        if(hL){ CTX.moveTo(cx2,   cy2);   CTX.lineTo(cx2,   cy2+s); }
        if(hR){ CTX.moveTo(cx2+s, cy2);   CTX.lineTo(cx2+s, cy2+s); }
        CTX.stroke();
      }
      CTX.globalAlpha = 1;

      // Number label
      let minR=99,maxR=0,minC2=99,maxC2=0;
      for(let row=0;row<cc.length;row++) for(let col=0;col<cc[row].length;col++){
        if(cc[row][col]){minR=Math.min(minR,row);maxR=Math.max(maxR,row);minC2=Math.min(minC2,col);maxC2=Math.max(maxC2,col);}
      }
      const rawBX=(minC2+maxC2)/2+0.5, rawBY=(minR+maxR)/2+0.5;
      const bfilled=[];
      for(let row=0;row<cc.length;row++) for(let col=0;col<cc[row].length;col++){
        if(!cc[row][col]) continue;
        const fx=col+0.5, fy=row+0.5;
        bfilled.push({fx,fy,d:(fx-rawBX)**2+(fy-rawBY)**2});
      }
      const bminD=bfilled.reduce((m,f)=>Math.min(m,f.d),Infinity);
      const btol=bminD*0.01+0.0001;
      const bnearest=bfilled.filter(f=>f.d<=bminD+btol);
      const bavgX=bnearest.reduce((s2,f)=>s2+f.fx,0)/bnearest.length;
      const bavgY=bnearest.reduce((s2,f)=>s2+f.fy,0)/bnearest.length;
      const numX=ox+bavgX*s, numY=oy+bavgY*s;
      const numSz=Math.max(10, s*1.2);
      const btnDrop=Math.max(1,Math.round(numSz*0.08));
      CTX.font=`900 ${Math.round(numSz)}px "Arial Black","Impact",sans-serif`;
      CTX.textAlign='center'; CTX.textBaseline='middle'; CTX.shadowBlur=0;
      CTX.fillStyle='rgba(0,0,0,0.6)';
      CTX.fillText(String(i+1), numX+btnDrop, numY+btnDrop);
      CTX.fillStyle='#ffffff';
      CTX.fillText(String(i+1), numX, numY);
    } else {
      CTX.font=F(FONT_SMALL, Math.max(8,PW2*0.18));
      CTX.textAlign='center'; CTX.textBaseline='middle';
      CTX.fillStyle=C.dimText;
      CTX.fillText(String(i+1), px+PW2/2, py+r.h/2);
    }
    CTX.globalAlpha = 1.0; // restore after each slot
  }
}


// ── Control row ──────────────────────────────────────────────────────
const CTRL_LABELS = ['↺','◀','▼','⬇','▶','↻'];
const CTRL_IDS    = ['rotl','left','soft','hard','right','rotr'];
let ctrlPressed   = {};

function drawControlRow(t){
  const r   = R.ctrl;
  const GAP = R.GAP;
  const CBW = Math.round((r.w - 5*GAP) / 6);
  for(let i=0;i<6;i++){
    const id      = 'ctrl_'+CTRL_IDS[i];
    const bx      = r.x + i*(CBW+GAP);
    const by      = r.y;
    const pressed = ctrlPressed[id];
    const rad     = Math.min(CBW, r.h) / 2;
    CTX.beginPath();
    CTX.arc(bx+CBW/2, by+r.h/2, rad*0.9, 0, Math.PI*2);
    CTX.fillStyle   = pressed ? 'rgba(0,150,255,0.7)' : 'rgba(0,60,150,0.85)';
    CTX.fill();
    CTX.strokeStyle = pressed ? C.cyan : '#3366cc';
    CTX.lineWidth   = 1.5;
    CTX.stroke();
    CTX.font         = F(FONT_LABEL, Math.max(10, rad*0.8));
    CTX.textAlign    = 'center';
    CTX.textBaseline = 'middle';
    CTX.fillStyle    = C.white;
    CTX.fillText(CTRL_LABELS[i], bx+CBW/2, by+r.h/2);
  }
}

function drawAutoRow(t){
  const r = R.auto;
  const GAP = R.GAP;
  const AUTO_BTN_W = Math.round(r.w * 0.25);
  const RECEIPT_W  = Math.round(r.w * 0.25);

  // AUTO toggle button
  const isOn = AUTO_PLAY;
  panel(r.x, r.y, AUTO_BTN_W, r.h, isOn ? C.autoBorder : C.border);
  const asz = Math.max(7, r.h*0.32);
  CTX.font=F(FONT_LABEL, asz);
  CTX.textAlign='center'; CTX.textBaseline='middle';
  CTX.fillStyle = isOn ? C.green : C.purple;
  if(isOn){CTX.shadowBlur=0;}
  const autoLabelColor = isOn ? C.green : C.purple;
  if(isOn){
    // Render "AUTO" | dot | "ON" with dot centered between the two words
    const wordH = r.h * 0.58;
    const wordY = r.y + r.h * 0.18;
    const halfW = (AUTO_BTN_W - 8) * 0.45;
    _dmWordLabel(CTX, 'AUTO', r.x + 4,           wordY, halfW,        wordH, C.green);
    _dmWordLabel(CTX, 'ON',   r.x + 4 + halfW + 10, wordY, halfW - 6, wordH, C.green);
    // Dot — centered in the gap between the two words
    const dotX = r.x + 4 + halfW + 5;
    const dotY = r.y + r.h * 0.50;
    const dotR = Math.max(2, r.h * 0.06);
    CTX.beginPath(); CTX.arc(dotX, dotY, dotR, 0, Math.PI*2);
    CTX.fillStyle = C.green;
    CTX.shadowColor = C.green; CTX.shadowBlur = 6;
    CTX.fill(); CTX.shadowBlur = 0;
  } else {
    _dmWordLabel(CTX, 'AUTO', r.x + 4, r.y + r.h*0.15, AUTO_BTN_W - 8, r.h*0.70, C.purple);
  }

  // ── Speed control zone ───────────────────────────────────────────────
  const SLX = r.x + AUTO_BTN_W + GAP;
  const SLW = R.sliderW;
  const SLY = r.y + r.h/2;
  const frac = (AUTO_SPEED - 1) / 10;

  // Track background
  const trkH = Math.max(6, r.h * 0.18);
  CTX.fillStyle = 'rgba(20,0,50,0.9)';
  roundRect(SLX, SLY - trkH/2, SLW, trkH, trkH/2); CTX.fill();

  // Filled portion gradient
  const fillGrd = CTX.createLinearGradient(SLX, 0, SLX + SLW, 0);
  fillGrd.addColorStop(0,    '#6600ff');
  fillGrd.addColorStop(0.45, '#00ccff');
  fillGrd.addColorStop(0.72, '#00ffaa');
  fillGrd.addColorStop(0.88, '#ffff00');
  fillGrd.addColorStop(1.0,  '#ff4400');
  CTX.fillStyle = fillGrd;
  roundRect(SLX, SLY - trkH/2, SLW * frac, trkH, trkH/2); CTX.fill();

  CTX.strokeStyle = 'rgba(100,0,200,0.5)';
  CTX.lineWidth = 1;
  roundRect(SLX, SLY - trkH/2, SLW, trkH, trkH/2); CTX.stroke();

  // Thumb
  const thumbX = SLX + SLW * frac;
  const thumbR = Math.max(7, r.h * 0.28);
  CTX.beginPath(); CTX.arc(thumbX, SLY, thumbR + 4, 0, Math.PI*2);
  CTX.fillStyle = `hsla(${280 - frac*280},100%,60%,0.25)`; CTX.fill();
  CTX.beginPath(); CTX.arc(thumbX, SLY, thumbR, 0, Math.PI*2);
  const thumbGrd = CTX.createRadialGradient(thumbX-thumbR*0.3, SLY-thumbR*0.3, 1, thumbX, SLY, thumbR);
  thumbGrd.addColorStop(0, '#ffffff');
  thumbGrd.addColorStop(1, `hsl(${280 - frac*280},100%,55%)`);
  CTX.fillStyle = thumbGrd; CTX.fill();
  CTX.strokeStyle = 'rgba(255,255,255,0.6)'; CTX.lineWidth = 1; CTX.stroke();

  // ── Centered SPEED label + number overlay ───────────────────────────
  // Center point is middle of the slider zone (not thumb)
  const centerX = SLX + SLW / 2;
  const centerY = SLY;

  // Pulse: active while dragging + 1s decay after release
  const secsSinceMove = AT - _lastSliderMoveT;
  const pulseDecay = _sliderDragging ? 1.0 : Math.max(0, 1.0 - secsSinceMove);
  // Size burst: oscillates at ~6Hz while active, decays smoothly
  const pulseMag = pulseDecay * (0.18 + 0.10 * Math.abs(Math.sin(t * 6 * Math.PI)));

  // Number string: suppress .00 fractional part
  const rawNum = AUTO_SPEED >= 11 ? '11.00' : AUTO_SPEED.toFixed(2);
  const numStr = rawNum.endsWith('.00') ? rawNum.slice(0, -3) : rawNum;

  // "SPEED" word — baseline size, centered, drawn first (under number)
  const labelBaseSz = Math.max(7, r.h * 0.26);
  const labelSz = labelBaseSz * (1 + pulseMag * 0.4);
  CTX.font = `900 ${Math.round(labelSz)}px monospace`;
  CTX.textAlign = 'center';
  CTX.textBaseline = 'middle';
  CTX.fillStyle = `rgba(160,80,255,${0.35 + pulseDecay * 0.25})`;
  CTX.fillText('SPEED', centerX, centerY);

  // Number — larger, on top of "SPEED"
  const numBaseSz = Math.max(12, r.h * 0.54);
  const numSz = numBaseSz * (1 + pulseMag);
  CTX.font = `900 ${Math.round(numSz)}px "Arial Black", monospace`;
  CTX.textBaseline = 'middle';

  // Drop shadow helper — draw numStr offset +2,+2 in 50% black before each color pass
  const shadow = (x, y) => {
    CTX.save();
    CTX.globalAlpha = 0.5;
    CTX.fillStyle = '#000000';
    CTX.shadowBlur = 0;
    CTX.fillText(numStr, x + 2, y + 2);
    CTX.restore();
  };

  // Color cycling ONLY while pulse is active; after calm → steady color
  const doCycle = AUTO_SPEED >= 10 && pulseDecay > 0;
  if(doCycle){
    const cycleRate = 2 + (AUTO_SPEED - 10) * 8;
    const hue = ((t * cycleRate * 60) % 360);
    const blendA = Math.min(1, (AUTO_SPEED - 10) * 2) * pulseDecay;
    if(blendA < 1){
      shadow(centerX, centerY);
      CTX.globalAlpha = 1 - blendA;
      CTX.fillStyle = '#ffffff';
      CTX.shadowColor = C.yellow; CTX.shadowBlur = 6 + pulseMag * 20;
      CTX.fillText(numStr, centerX, centerY);
      CTX.globalAlpha = 1.0;
    }
    shadow(centerX, centerY);
    CTX.globalAlpha = Math.max(blendA, 0.01);
    CTX.fillStyle = `hsl(${hue},100%,68%)`;
    CTX.shadowColor = `hsl(${hue},100%,68%)`;
    CTX.shadowBlur = 14 + pulseMag * 24 + Math.sin(t * cycleRate * Math.PI) * 6;
    CTX.fillText(numStr, centerX, centerY);
    CTX.globalAlpha = 1.0;
  } else {
    // Steady — white→yellow normally, white→orange for speed >=10 at rest
    const nGrd = CTX.createLinearGradient(centerX - 30, centerY, centerX + 30, centerY + numSz);
    nGrd.addColorStop(0, '#ffffff');
    nGrd.addColorStop(1, AUTO_SPEED >= 10 ? '#ff8800' : C.yellow);
    CTX.fillStyle = nGrd;
    CTX.shadowColor = AUTO_SPEED >= 10 ? '#ff8800' : C.yellow;
    CTX.shadowBlur = 4 + pulseMag * 22;
    shadow(centerX, centerY);
    CTX.fillText(numStr, centerX, centerY);
  }
  CTX.shadowBlur = 0;

  // RECEIPT button — only interactive when paused or dead
  const RX = r.x + r.w - RECEIPT_W;
  const receiptAvail = paused || dead || !ui.gameStarted;
  panel(RX, r.y, RECEIPT_W, r.h, receiptAvail ? '#aa6600' : '#442200');
  _dmWordLabel(CTX, 'RECEIPT', RX+2, r.y + r.h*0.12, RECEIPT_W-4, r.h*0.76,
    receiptAvail ? '#ffcc44' : '#664422');
}

// ── Tip bubble: hints player about faster placement controls ─────────
function drawTipBubble(t){
  if(AUTO_PLAY || autoUsed || dead || paused || !ui.gameStarted) return;
  if(_tipChoiceUsed || _tipDismissed) return;
  if(_tipMoveCount < 12) return;
  if(_tipShownAt === 0) _tipShownAt = t;
  const age = t - _tipShownAt;
  if(age > 7.0){ _tipDismissed = true; return; }

  let alpha = 1.0;
  if(age < 0.4)      alpha = age / 0.4;
  else if(age > 6.0) alpha = Math.max(0, 7.0 - age);
  if(alpha <= 0) return;

  // Fit entirely inside the lower portion of the playfield
  // Playfield: R.gx, R.gy, R.gw, R.gh
  const bw  = R.gw * 0.88;
  const bh  = R.gh * 0.22;
  const bx  = R.gx + (R.gw - bw) / 2;
  const by  = R.gy + R.gh * 0.72;   // lower 28% of board — usually empty early on
  const br  = 10;

  CTX.save();
  CTX.globalAlpha = alpha * 0.96;

  // Bubble body
  CTX.shadowColor='rgba(0,0,0,0.7)'; CTX.shadowBlur=14;
  CTX.fillStyle = 'rgba(8,6,24,0.94)';
  roundRect(bx, by, bw, bh, br); CTX.fill();
  CTX.shadowBlur=0;

  // Pulsing border
  const pulse = 0.55 + 0.45*Math.sin(t*3.5);
  CTX.strokeStyle = `rgba(0,200,255,${pulse})`;
  CTX.lineWidth = 1.8;
  roundRect(bx, by, bw, bh, br); CTX.stroke();

  // Upward arrow notch at top-center pointing toward choice buttons
  const ax = bx + bw/2;
  CTX.beginPath();
  CTX.moveTo(ax-9, by);
  CTX.lineTo(ax,   by-12);
  CTX.lineTo(ax+9, by);
  CTX.fillStyle='rgba(8,6,24,0.94)'; CTX.fill();
  CTX.strokeStyle=`rgba(0,200,255,${pulse})`; CTX.lineWidth=1.5; CTX.stroke();

  // Three lines of DM text inside bubble
  const lh = bh / 3.4;
  _dmWordLabel(CTX, 'TAP A PIECE ABOVE TO PLACE IT!', bx+bw*0.04, by+bh*0.06,       bw*0.92, lh, '#00eeff');
  _dmWordLabel(CTX, 'OR TAP ITS GHOST ON THE BOARD', bx+bw*0.04, by+bh*0.06+lh*1.1, bw*0.92, lh*0.85, 'rgba(180,180,255,0.9)');
  _dmWordLabel(CTX, 'MUCH FASTER THAN MOVE BUTTONS', bx+bw*0.04, by+bh*0.06+lh*2.1, bw*0.92, lh*0.72, 'rgba(100,100,160,0.8)');

  CTX.globalAlpha = 1.0;
  CTX.restore();
}


function drawPauseOverlay(){
  // During autoplay / replay: no darkening — board should remain visible.
  if(AUTO_PLAY||_replayMode) return;
  // Human pause: near-blackout so position isn't memorised
  CTX.fillStyle='rgba(0,0,0,0.92)';
  CTX.fillRect(R.gx, R.gy, R.gw, R.gh);
  CTX.fillStyle='rgba(40,0,80,0.25)';
  for(let row=0;row<ROWS;row++){
    for(let col=0;col<COLS;col++){
      const px=R.gx+col*CELL+CELL/2;
      const py=R.gy+row*CELL+CELL/2;
      CTX.fillRect(px-0.5,py-0.5,1.5,1.5);
    }
  }
}

// INPUT
// ══════════════════════════════════════════════════════════════════════

let _sliderDragging=false;
let _speedResumeTimer=null; // timer to resume game after slider release
let _lastSliderMoveT=0; // AT timestamp of last slider move

function hitTest(tx, ty){
  for(let i=hitZones.length-1;i>=0;i--){
    const z=hitZones[i];
    if(tx>=z.x && tx<=z.x+z.w && ty>=z.y && ty<=z.y+z.h) return z.id;
  }
  return null;
}

function handleTap(tx, ty){
  // Identity screen owns all input while showing
  if(_identityScreen){
    const hit = _idHitZones.find(z => tx>=z.x && tx<=z.x+z.w && ty>=z.y && ty<=z.y+z.h);
    if(!hit) return;
    if(hit.type === 'char'){
      _pickChar(hit.ch);
      for(let i=0;i<_EQ_N;i++) _eqSpike[i] = 0.4 + Math.random()*0.6;
      _eqSpikeT = AT;
    } else if(hit.type === 'backspace'){
      _namePreFilled = false;
      if(_nameChars.length > 0) _nameChars.pop();
    } else if(hit.type === 'play'){
      _confirmIdentityCanvas();
    }
    return;
  }

  // Replay prompt is a modal — intercept all taps
  if(_replayPromptVisible){
    if(ui._replayWatchW&&tx>=ui._replayWatchX&&tx<=ui._replayWatchX+ui._replayWatchW&&
       ty>=ui._replayWatchY&&ty<=ui._replayWatchY+ui._replayWatchH){
      _startReplayMode(_pendingReplayStream);
    } else if(ui._replaySkipW&&tx>=ui._replaySkipX&&tx<=ui._replaySkipX+ui._replaySkipW&&
              ty>=ui._replaySkipY&&ty<=ui._replaySkipY+ui._replaySkipH){
      _pendingReplayStream=null;_replayPromptVisible=false;
    }
    return;
  }
  // Replay transport controls — active during playback and after completion
  if(_replayMode || (_replaySource && dead)){
    const idR=hitTest(tx,ty);
    switch(idR){
      case 'replay_back':  _startReplayMode(_replaySource); return;
      case 'replay_play':  if(_replayMode&&_replayPaused){ _toggleReplayPause(); return; } break;
      case 'replay_pause': if(_replayMode&&!_replayPaused){ _toggleReplayPause(); return; } break;
      case 'replay_stop':  _stopReplayMode(); return;
      case 'pause':        if(_replayMode){ _toggleReplayPause(); return; } break;
    }
    if(_replayMode) return; // block other taps only during active playback
  }

  // Marquee is always tappable — check before any game-state gating
  const idEarly = hitTest(tx, ty);
  if(idEarly === 'marquee'){
    if(paused && ui.gameStarted && !dead){
      // Tap on paused marquee = resume game (marquee is the "tap here to resume" affordance)
      togglePause();
    } else {
      _mqUserPaused = !_mqUserPaused;
      if(_mqUserPaused){ _mqPauseCount++; _mqPauseStartT = performance.now(); }
      else { _mqTotalPauseMs += performance.now() - _mqPauseStartT; }
    }
    return;
  }

  // Start screen: only fire if game not yet started AND tap is on the button
  if(!ui.gameStarted){
    if(ui._startBtnW && tx>=ui._startBtnX && tx<=ui._startBtnX+ui._startBtnW &&
       ty>=ui._startBtnY && ty<=ui._startBtnY+ui._startBtnH){
      startGame();
    }
    return;
  }

  const id=hitTest(tx,ty);

  // Triple-tap on LEVEL box toggles debug mode
  if(R.lLevel && tx>=R.lLevel.x && tx<=R.lLevel.x+R.lLevel.w &&
     ty>=R.lLevel.y && ty<=R.lLevel.y+R.lLevel.h){
    const now = AT;
    ui._levelTaps.push(now);
    ui._levelTaps = ui._levelTaps.filter(t2 => now - t2 < 1.0); // within 1 sec
    if(ui._levelTaps.length >= 3){
      ui._levelTaps = [];
      ui.debugMode = !ui.debugMode;
      ui.flash = {text: 'DEBUG '+(ui.debugMode?'ON':'OFF'), until: performance.now()+1200};
    }
  }

  // DEBUG: record tap (shown only when debugMode on)
  ui._dbgTap = {tx,ty,id:id||'canvas',t:AT};

  // Game-over state: buttons inactive for 1 second after death
  if(dead){
    if(performance.now() - _deadAt < 1000) return;
    if(ui._receiptBtnW && tx>=ui._receiptBtnX && tx<=ui._receiptBtnX+ui._receiptBtnW &&
       ty>=ui._receiptBtnY && ty<=ui._receiptBtnY+ui._receiptBtnH){
      showReceipt(); return;
    }
    if(ui._playAgainW && tx>=ui._playAgainX && tx<=ui._playAgainX+ui._playAgainW &&
       ty>=ui._playAgainY && ty<=ui._playAgainY+ui._playAgainH){
      if(performance.now()-_deadAt >= 3000) _showIdentityCanvas(()=>restart(false));
      else restart(false);
      return;
    }
    if(ui._playAutoW && tx>=ui._playAutoX && tx<=ui._playAutoX+ui._playAutoW &&
       ty>=ui._playAutoY && ty<=ui._playAutoY+ui._playAutoH){
      restart(true); return;
    }
    // Also allow the corner RECEIPT hit zone while dead (disabled during replay)
    if(id === 'receipt' && !_replaySource){ showReceipt(); return; }
    if(id === 'pause'){
      if(_replaySource){
        _replaySource=null;
        _replayDisplayName=null;
        _showIdentityCanvas(()=>restart(false));
        return;
      }
      if(performance.now()-_deadAt >= 3000) _showIdentityCanvas(()=>restart(false));
      else restart(false);
      return;
    }
    return;
  }

  // ── AUTO_PLAY / REPLAY GUARD: robot owns piece movement ──────────────────────
  // Only pause and receipt allowed when autoplay or replay is active.
  if((AUTO_PLAY||_replayMode) && ui.gameStarted && !dead){
    if(!id){
      // Tap on canvas (ghost selection) — blocked in autoplay
      return;
    }
    switch(id){
      case 'pause':        if(dead) restart(false); else togglePause(); break;
      case 'auto_toggle':  toggleAutoPlay(); break; // allow turning OFF
      case 'receipt':      if(paused||dead) showReceipt(); break;
      case 'receipt_close':hideReceipt(); break;
      case 'speed_slider': break; // handled by slider path
      // Everything else (piece0-3, tetris, ctrl_*, canvas) — silently ignored
    }
    return; // never fall through to human controls
  }

  if(!id){
    handleCanvasTap(tx, ty);
    return;
  }
  switch(id){
    case 'pause':     if(dead) restart(false); else if(ui.gameStarted) togglePause(); break;
    case 'piece0': case 'piece1': case 'piece2': case 'piece3':
      choose(parseInt(id[5])); break;
    case 'tetris':    chooseTetris(); break;
    case 'ctrl_rotl': rot(-1); break;
    case 'ctrl_rotr': rot(1); break;
    case 'ctrl_soft': sdrop(); break;
    case 'ctrl_hard': hdrop(); break;
    case 'ctrl_left': mhz(-1); break;
    case 'ctrl_right':mhz(1);  break;
    case 'auto_toggle': if(ui.gameStarted&&!dead) toggleAutoPlay(); break;
    case 'receipt':        if(paused||dead||!ui.gameStarted) showReceipt(); break;
    case 'receipt_close':  hideReceipt(); break;
    case 'speed_slider': break;
    default:
      // Any unrecognised zone — also try ghost tap
      if(ui.gameStarted && !dead) handleCanvasTap(tx, ty);
  }
}

function handleSlider(tx){
  const frac = Math.max(0, Math.min(1, (tx - R.sliderX) / R.sliderW));
  const spd = Math.min(11.0, 1 + frac * 10);
  _lastSliderMoveT = AT;
  setAutoSpeed(spd);
  // In human mode: if slider increases speed, restart the drop timer so the
  // new speed takes effect immediately on the current piece.
  if(!AUTO_PLAY && ui.gameStarted && !dead && !paused && cur){
    // Only reschedule if the new interval is shorter than remaining deadline
    const gravMs = NES_SP[Math.min(level-1, NES_SP.length-1)];
    const remaining = _dropDeadline - performance.now();
    if(remaining > gravMs){
      // Slider moved to faster speed — snap deadline forward
      _dropDeadline = performance.now() + gravMs;
    }
  }
}

// Hold-repeat for left/right
let _holdId=null, _holdIv=null;
function startHold(id){
  if(AUTO_PLAY||_replayMode) return;
  stopHold();
  _holdId=id;
  handleTap(0,0); // won't match - call direct
  // direct call
  if(id==='ctrl_left') mhz(-1);
  else if(id==='ctrl_right') mhz(1);
  _holdIv=setInterval(()=>{
    if(AUTO_PLAY||_replayMode){ stopHold(); return; }
    if(id==='ctrl_left') mhz(-1);
    else if(id==='ctrl_right') mhz(1);
  },80);
}
function stopHold(){
  clearInterval(_holdIv); _holdIv=null; _holdId=null;
}

cv.addEventListener('touchstart', function(e){
  e.preventDefault();
  for(let t of e.changedTouches){
    const tx=t.clientX, ty=t.clientY;
    const id=hitTest(tx,ty);
    if(id==='ctrl_left'||id==='ctrl_right'){
      ctrlPressed[id.replace('ctrl_','')]=true;

      _sliderDragging=true;
      handleSlider(tx);
    } else {
      handleTap(tx,ty);
      if(id&&id.startsWith('ctrl_')) ctrlPressed[id.replace('ctrl_','')]=true;
    }
  }
},{passive:false});

},{passive:false});

  e.preventDefault();
  _sliderDragging=false;

},{passive:false});
